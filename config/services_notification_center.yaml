services:
    _defaults:
        autoconfigure: true

    # Le constructeur est hérité de RegistrationController (Notification Center).
    # Il est AUTOWIRÉ plutôt que recopié : une liste d'arguments en dur compile
    # sans erreur avec un argument en moins, et ne casse qu'à l'exécution, sur la
    # page d'inscription (constaté avec Notification Center 2.7.6, qui a ajouté
    # ParameterBagInterface). Autowiré, un nouvel argument amont est soit résolu
    # seul, soit refusé à la compilation du conteneur : au déploiement, jamais
    # chez un visiteur.
    GreenEffect\EmailLoginBundle\Module\EmailRegistrationController:
        autowire: true
        bind:
            # Contao n'expose pas OptInInterface sous forme d'alias : c'est la
            # seule dépendance qu'il faut nommer.
            $optIn: '@contao.opt_in'
